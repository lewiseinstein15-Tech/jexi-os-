# Auto-deploy the JEXI OS load balancer to Cloudflare Workers — FREE.
#
# No need to paste code in the Cloudflare dashboard. Just:
#   1. Cloudflare → My Profile → API Tokens → Create Token → template
#      "Edit Cloudflare Workers" → create → copy the token.
#   2. GitHub → repo Settings → Secrets and variables → Actions → new repo secrets:
#        CLOUDFLARE_API_TOKEN = <the token>
#        CLOUDFLARE_ACCOUNT_ID = <your account number, from dash.cloudflare.com URL>
#   3. Run this workflow (Actions → "Deploy Load Balancer" → Run workflow),
#      or just push a change to deploy/lb-worker.js — it deploys itself.
#
# Result: https://jexi-lb.<your-subdomain>.workers.dev

name: Deploy Load Balancer

on:
  push:
    branches: [ main ]
    paths:
      - 'deploy/lb-worker.js'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # B198b — two fixes for the run-failing-since-Aug-9 load balancer:
      #   1. wrangler-action's internal `npx wrangler` prompt-cancels on
      #      missing-package confirmation → run wrangler ourselves with --yes.
      #   2. No CLOUDFLARE_* secrets are configured in this repo, so a real
      #      deploy can only fail on auth. Match the render-deploy pattern:
      #      warn and exit 0 (safe no-op) until the secrets exist.
      - name: Deploy worker with wrangler
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set — add them in repo Settings → Secrets to enable the optional load balancer. Skipping (the app talks to the brain directly)."
            exit 0
          fi
          npx --yes wrangler@4 deploy deploy/lb-worker.js --name jexi-lb
