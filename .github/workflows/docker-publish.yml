# B178 — Build the SLIM Docker image on GitHub Actions (FREE 2000 min/mo)
# and publish it to the GitHub Container Registry. Render then deploys the
# READY image — its free plan build minutes are never consumed.
# Render free also runs one always-on web service 24/7 (750 hrs/mo).

name: Publish Docker image

# DISABLED push trigger 2026-09-22 (CI failure sweep):
# Phase 24 (merge 3c1446a4) rewired src/components/ChatWindow.jsx to import
# ../../ui/web/console/chat/mount.js, but Dockerfile.slim copies only
# package*/index.html/vite/tailwind/postcss/public/src/commands into the
# image — never ui/. The in-image `npm run build` therefore fails:
#   Could not resolve "../../ui/web/console/chat/mount.js" from
#   "src/components/ChatWindow.jsx"
# Root fix = add `COPY ui ./ui` to Dockerfile.slim before the build step.
# Dockerfile.slim is OUTSIDE this sweep's file zone (.github/**, tests) —
# fix proposed to lead, pending approval. Manual runs only until then.
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sanitize image name (lowercase + trim trailing dashes — the repo is 'jexi-os-')
        id: name
        run: |
          IMG="$(echo "$REGISTRY/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[-_.]+$//')"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          echo "IMAGE=$IMG" >> "$GITHUB_ENV"

      - name: Build and push slim image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.slim
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deploy via API (pulls the fresh image)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::warning::RENDER_API_KEY / RENDER_SERVICE_ID not set — auto-deploy disabled."
            exit 0
          fi
          # The old RENDER_IMAGE_DEPLOY_HOOK / RENDER_DEPLOY_HOOK secrets held
          # deploy-hook URLs of RETIRED Render services — the pings silently
          # hit 404s (curl without -f exits 0) so nothing ever deployed.
          # Trigger through the Render API against the LIVE service instead.
          HTTP=$(curl -sS -m 60 -o deploy.json -w '%{http_code}' -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"clearCache":"do_not_clear"}')
          cat deploy.json; echo
          if [ "$HTTP" != "201" ]; then echo "::error::Render deploy trigger failed (HTTP $HTTP)"; exit 1; fi
          DEPLOY_ID=$(jq -r '.deploy.id // .id' deploy.json)
          if [ -z "$DEPLOY_ID" ] || [ "$DEPLOY_ID" = "null" ]; then echo "::error::could not read deploy id from Render response"; cat deploy.json; exit 1; fi
          echo "RENDER_DEPLOY_ID=$DEPLOY_ID" >> "$GITHUB_ENV"
          echo "Render deploy $DEPLOY_ID triggered — watching it."

      - name: Summary
        run: |
          echo "### 🐳 Image published" >> $GITHUB_STEP_SUMMARY
          echo '```
          ${{ steps.name.outputs.image }}:latest
          ```' >> $GITHUB_STEP_SUMMARY
          echo "Point Render (Deploy an existing image) at this URL — free plan, zero build minutes." >> $GITHUB_STEP_SUMMARY

      # B214 — deploy watching ONLY makes sense after :latest is actually
      # pushed. The old "ping a deploy-hook URL" step is replaced by an API
      # trigger + status watch: a stale hook URL silently 404'd for months.
      - name: Watch the Render deploy until it is live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_DEPLOY_ID" ]; then
            echo "::warning::no deploy was triggered this run — nothing to watch."
            exit 0
          fi
          for i in $(seq 1 40); do
            sleep 15
            RESP=$(curl -sS -m 30 -w '\n%{http_code}' -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$RENDER_DEPLOY_ID")
            CODE=$(echo "$RESP" | tail -1)
            ST=$(echo "$RESP" | sed '$d' | jq -r '.status // .deploy.status // "unknown"')
            if [ "$CODE" = "404" ]; then echo "::error::deploy id $RENDER_DEPLOY_ID not found (HTTP 404)"; exit 1; fi
            echo "attempt $i: $ST"
            if [ "$ST" = "live" ]; then echo "Render deploy is LIVE."; exit 0; fi
            if [ "$ST" = "update_failed" ] || [ "$ST" = "build_failed" ] || [ "$ST" = "canceled" ] || [ "$ST" = "deactivated" ]; then
              echo "::error::Render deploy ended with status: $ST"; exit 1
            fi
          done
          echo "::error::Render deploy did not go live within 10 minutes"; exit 1
