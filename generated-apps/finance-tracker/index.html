<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApexFinance - Personal Finance Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #151c2c;
      --bg-card-hover: #1e293b;
      --border-color: #2a364f;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --accent-primary: #6366f1;
      --accent-primary-hover: #4f46e5;
      --income-color: #10b981;
      --income-bg: rgba(16, 185, 129, 0.12);
      --expense-color: #f43f5e;
      --expense-bg: rgba(244, 63, 94, 0.12);
      --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --radius-lg: 16px;
      --radius-md: 10px;
      --radius-sm: 6px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: var(--font-family);
      min-height: 100vh;
      padding: 24px;
      line-height: 1.5;
    }

    .app-header {
      max-width: 1300px;
      margin: 0 auto 28px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 22px;
      color: #fff;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    .brand h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 10px 18px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.875rem;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-family);
    }

    .btn-primary {
      background-color: var(--accent-primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .btn-primary:hover {
      background-color: var(--accent-primary-hover);
      transform: translateY(-1px);
    }

    .btn-outline {
      background-color: transparent;
      border-color: var(--border-color);
      color: var(--text-muted);
    }

    .btn-outline:hover {
      background-color: var(--bg-card-hover);
      color: var(--text-primary);
      border-color: #475569;
    }

    .btn-danger-outline {
      background-color: transparent;
      border-color: rgba(244, 63, 94, 0.3);
      color: #f43f5e;
    }

    .btn-danger-outline:hover {
      background-color: var(--expense-bg);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.8rem;
    }

    .dashboard-container {
      max-width: 1300px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 22px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease;
    }

    .stat-card:hover {
      transform: translateY(-2px);
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
    }

    .stat-card.balance::before { background: linear-gradient(90deg, #6366f1, #a855f7); }
    .stat-card.income::before { background: var(--income-color); }
    .stat-card.expense::before { background: var(--expense-color); }
    .stat-card.savings::before { background: linear-gradient(90deg, #3b82f6, #06b6d4); }

    .stat-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .stat-value.income-text { color: var(--income-color); }
    .stat-value.expense-text { color: var(--expense-color); }

    .stat-sub {
      font-size: 0.775rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* Main Content Layout */
    .main-grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 24px;
    }

    @media (max-width: 1024px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-primary);
    }

    /* Form Styling */
    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.825rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 0.95rem;
      font-family: var(--font-family);
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--accent-primary);
    }

    .type-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .type-btn {
      padding: 10px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background: var(--bg-main);
      color: var(--text-muted);
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .type-btn.active[data-type="expense"] {
      background: var(--expense-bg);
      color: var(--expense-color);
      border-color: rgba(244, 63, 94, 0.4);
    }

    .type-btn.active[data-type="income"] {
      background: var(--income-bg);
      color: var(--income-color);
      border-color: rgba(16, 185, 129, 0.4);
    }

    /* Canvas Chart */
    .chart-container {
      position: relative;
      width: 100%;
      height: 260px;
      margin-top: 10px;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* Transactions Section */
    .content-column {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .filter-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .filter-bar .form-control {
      padding: 8px 12px;
      font-size: 0.85rem;
    }

    .search-input {
      flex: 1;
      min-width: 180px;
    }

    .transaction-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .transaction-list::-webkit-scrollbar {
      width: 6px;
    }
    .transaction-list::-webkit-scrollbar-track {
      background: var(--bg-main);
      border-radius: 10px;
    }
    .transaction-list::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 10px;
    }

    .tx-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .tx-item:hover {
      border-color: #475569;
      transform: translateX(2px);
    }

    .tx-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .tx-badge {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .tx-badge.income {
      background: var(--income-bg);
      color: var(--income-color);
    }

    .tx-badge.expense {
      background: var(--expense-bg);
      color: var(--expense-color);
    }

    .tx-details {
      display: flex;
      flex-direction: column;
    }

    .tx-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-primary);
    }

    .tx-meta {
      font-size: 0.775rem;
      color: var(--text-muted);
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 2px;
    }

    .tx-category-tag {
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      text-transform: capitalize;
    }

    .tx-amount-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .tx-amount {
      font-weight: 700;
      font-size: 1rem;
      text-align: right;
    }

    .tx-amount.income { color: var(--income-color); }
    .tx-amount.expense { color: var(--expense-color); }

    .btn-delete {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: var(--radius-sm);
      transition: color 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-delete:hover {
      color: var(--expense-color);
      background: var(--expense-bg);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    /* Helper Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-in {
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-icon">$</div>
      <div>
        <h1>ApexFinance</h1>
        <p style="font-size: 0.8rem; color: var(--text-muted);">Personal Finance Dashboard</p>
      </div>
    </div>
    <div class="header-actions">
      <button type="button" class="btn btn-outline btn-sm" id="btnLoadSample">Load Demo Data</button>
      <button type="button" class="btn btn-danger-outline btn-sm" id="btnClearAll">Clear All Data</button>
    </div>
  </header>

  <main class="dashboard-container">
    <!-- Summary Cards -->
    <section class="stats-grid">
      <div class="stat-card balance">
        <div class="stat-label">Net Balance</div>
        <div class="stat-value" id="totalBalance">$0.00</div>
        <div class="stat-sub">Total available liquid funds</div>
      </div>
      <div class="stat-card income">
        <div class="stat-label">Total Income</div>
        <div class="stat-value income-text" id="totalIncome">+$0.00</div>
        <div class="stat-sub" id="incomeCount">0 transactions</div>
      </div>
      <div class="stat-card expense">
        <div class="stat-label">Total Expenses</div>
        <div class="stat-value expense-text" id="totalExpenses">-$0.00</div>
        <div class="stat-sub" id="expenseCount">0 transactions</div>
      </div>
      <div class="stat-card savings">
        <div class="stat-label">Savings Rate</div>
        <div class="stat-value" id="savingsRate">0%</div>
        <div class="stat-sub">Income retained</div>
      </div>
    </section>

    <!-- Main Grid Layout -->
    <div class="main-grid">
      <!-- Left Sidebar: Entry Form -->
      <div class="card">
        <div class="card-title">
          <span>Add Transaction</span>
        </div>
        <form id="transactionForm">
          <div class="type-selector">
            <button type="button" class="type-btn active" data-type="expense" id="typeExpenseBtn">Expense</button>
            <button type="button" class="type-btn" data-type="income" id="typeIncomeBtn">Income</button>
          </div>

          <div class="form-group">
            <label class="form-label" for="amount">Amount ($)</label>
            <input type="number" step="0.01" id="amount" class="form-control" placeholder="0.00" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="description">Description</label>
            <input type="text" id="description" class="form-control" placeholder="e.g. Grocery Shopping" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="category">Category</label>
            <select id="category" class="form-control" required></select>
          </div>

          <div class="form-group">
            <label class="form-label" for="date">Date</label>
            <input type="date" id="date" class="form-control" required>
          </div>

          <button type="button" id="btnSubmitTx" class="btn btn-primary" style="width: 100%; justify-content: center;">
            Add Transaction
          </button>
        </form>
      </div>

      <!-- Right Main Column: Chart & Transaction List -->
      <div class="content-column">
        <!-- Canvas Chart Card -->
        <div class="card">
          <div class="card-title">
            <span>Expenses by Category</span>
            <span style="font-size: 0.8rem; font-weight: 500; color: var(--text-muted);" id="chartSummaryLabel">Visual Distribution</span>
          </div>
          <div class="chart-container">
            <canvas id="categoryChart"></canvas>
          </div>
        </div>

        <!-- Transaction List Card -->
        <div class="card">
          <div class="card-title">
            <span>Recent Transactions</span>
            <span style="font-size: 0.8rem; font-weight: 400; color: var(--text-muted);" id="txCountBadge">0 items</span>
          </div>

          <!-- Filter / Search Controls -->
          <div class="filter-bar">
            <input type="text" id="searchInput" class="form-control search-input" placeholder="Search description...">
            <select id="filterType" class="form-control" style="width: 130px;">
              <option value="all">All Types</option>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
            <select id="filterCategory" class="form-control" style="width: 150px;">
              <option value="all">All Categories</option>
            </select>
          </div>

          <!-- Scrollable List -->
          <div class="transaction-list" id="transactionList">
            <!-- Rendered via JS -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Category definitions with icons/colors
    const CATEGORIES = {
      expense: [
        { id: 'housing', name: 'Housing & Rent', icon: '🏠', color: '#f43f5e' },
        { id: 'food', name: 'Food & Dining', icon: '🍔', color: '#fb923c' },
        { id: 'transport', name: 'Transportation', icon: '🚗', color: '#38bdf8' },
        { id: 'utilities', name: 'Utilities & Bills', icon: '💡', color: '#facc15' },
        { id: 'entertainment', name: 'Entertainment', icon: '🎬', color: '#a855f7' },
        { id: 'shopping', name: 'Shopping', icon: '🛍️', color: '#ec4899' },
        { id: 'health', name: 'Health & Fitness', icon: '🩺', color: '#34d399' },
        { id: 'other_expense', name: 'Other Expense', icon: '📦', color: '#94a3b8' }
      ],
      income: [
        { id: 'salary', name: 'Salary & Wages', icon: '💼', color: '#10b981' },
        { id: 'freelance', name: 'Freelance / Side', icon: '💻', color: '#06b6d4' },
        { id: 'investments', name: 'Investments', icon: '📈', color: '#6366f1' },
        { id: 'gifts', name: 'Gifts & Bonuses', icon: '🎁', color: '#f43f5e' },
        { id: 'other_income', name: 'Other Income', icon: '💰', color: '#8b5cf6' }
      ]
    };

    const STORAGE_KEY = 'apex_finance_transactions_v1';

    // State
    let transactions = [];
    let currentType = 'expense';

    // DOM Elements
    const typeExpenseBtn = document.getElementById('typeExpenseBtn');
    const typeIncomeBtn = document.getElementById('typeIncomeBtn');
    const categorySelect = document.getElementById('category');
    const amountInput = document.getElementById('amount');
    const descInput = document.getElementById('description');
    const dateInput = document.getElementById('date');
    const btnSubmitTx = document.getElementById('btnSubmitTx');
    const txListContainer = document.getElementById('transactionList');
    const searchInput = document.getElementById('searchInput');
    const filterType = document.getElementById('filterType');
    const filterCategory = document.getElementById('filterCategory');
    const btnClearAll = document.getElementById('btnClearAll');
    const btnLoadSample = document.getElementById('btnLoadSample');
    const canvas = document.getElementById('categoryChart');
    const ctx = canvas.getContext('2d');

    // Format Currency
    function formatCurrency(amount) {
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
        minimumFractionDigits: 2
      }).format(amount);
    }

    // Format Date
    function formatDate(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      const date = new Date(parts[0], parts[1] - 1, parts[2]);
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    // Initialize App
    function init() {
      // Set default date to today
      dateInput.value = new Date().toISOString().split('T')[0];
      
      // Event Listeners
      typeExpenseBtn.addEventListener('click', () => setType('expense'));
      typeIncomeBtn.addEventListener('click', () => setType('income'));
      btnSubmitTx.addEventListener('click', handleAddTransaction);
      btnClearAll.addEventListener('click', clearAllData);
      btnLoadSample.addEventListener('click', loadSampleData);
      searchInput.addEventListener('input', render);
      filterType.addEventListener('change', render);
      filterCategory.addEventListener('change', render);
      window.addEventListener('resize', drawChart);

      // Load Data
      loadTransactions();
      populateCategorySelect();
      populateFilterCategories();
      render();
    }

    function setType(type) {
      currentType = type;
      if (type === 'expense') {
        typeExpenseBtn.classList.add('active');
        typeIncomeBtn.classList.remove('active');
      } else {
        typeIncomeBtn.classList.add('active');
        typeExpenseBtn.classList.remove('active');
      }
      populateCategorySelect();
    }

    function populateCategorySelect() {
      categorySelect.innerHTML = '';
      const list = CATEGORIES[currentType];
      list.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.id;
        opt.textContent = `${cat.icon} ${cat.name}`;
        categorySelect.appendChild(opt);
      });
    }

    function populateFilterCategories() {
      filterCategory.innerHTML = '<option value="all">All Categories</option>';
      const allCats = [...CATEGORIES.expense, ...CATEGORIES.income];
      allCats.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.id;
        opt.textContent = `${cat.icon} ${cat.name}`;
        filterCategory.appendChild(opt);
      });
    }

    function handleAddTransaction() {
      const amount = parseFloat(amountInput.value);
      const description = descInput.value.trim();
      const category = categorySelect.value;
      const date = dateInput.value;

      if (isNaN(amount) || amount <= 0) {
        alert('Please enter a valid positive amount.');
        return;
      }
      if (!description) {
        alert('Please enter a description.');
        return;
      }
      if (!date) {
        alert('Please select a date.');
        return;
      }

      const newTx = {
        id: 'tx_' + Date.now(),
        type: currentType,
        amount: amount,
        description: description,
        category: category,
        date: date
      };

      transactions.unshift(newTx);
      saveTransactions();
      
      // Reset Form
      amountInput.value = '';
      descInput.value = '';
      
      render();
    }

    function deleteTransaction(id) {
      transactions = transactions.filter(t => t.id !== id);
      saveTransactions();
      render();
    }

    function saveTransactions() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
    }

    function loadTransactions() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) {
        try {
          transactions = JSON.parse(data);
        } catch(e) {
          transactions = [];
        }
      } else {
        // Load default sample data on first visit
        loadSampleData();
      }
    }

    function clearAllData() {
      if (confirm('Are you sure you want to clear all transactions?')) {
        transactions = [];
        saveTransactions();
        render();
      }
    }

    function loadSampleData() {
      const today = new Date();
      const dateStr = (offsetDays) => {
        const d = new Date(today);
        d.setDate(d.getDate() - offsetDays);
        return d.toISOString().split('T')[0];
      };

      transactions = [
        { id: 'tx_1', type: 'income', amount: 4200, description: 'Monthly Salary', category: 'salary', date: dateStr(2) },
        { id: 'tx_2', type: 'expense', amount: 1400, description: 'Apartment Rent', category: 'housing', date: dateStr(3) },
        { id: 'tx_3', type: 'expense', amount: 125.50, description: 'Grocery Store', category: 'food', date: dateStr(1) },
        { id: 'tx_4', type: 'expense', amount: 45.00, description: 'Gas Station', category: 'transport', date: dateStr(4) },
        { id: 'tx_5', type: 'expense', amount: 80.00, description: 'Electric & Water', category: 'utilities', date: dateStr(5) },
        { id: 'tx_6', type: 'income', amount: 350.00, description: 'Freelance Design', category: 'freelance', date: dateStr(6) },
        { id: 'tx_7', type: 'expense', amount: 65.00, description: 'Dinner Night', category: 'food', date: dateStr(0) }
      ];
      saveTransactions();
      render();
    }

    function getCategoryInfo(catId) {
      const all = [...CATEGORIES.expense, ...CATEGORIES.income];
      return all.find(c => c.id === catId) || { name: catId, icon: '📄', color: '#94a3b8' };
    }

    function renderSummary() {
      let totalInc = 0;
      let totalExp = 0;
      let countInc = 0;
      let countExp = 0;

      transactions.forEach(t => {
        if (t.type === 'income') {
          totalInc += t.amount;
          countInc++;
        } else {
          totalExp += t.amount;
          countExp++;
        }
      });

      const netBalance = totalInc - totalExp;
      const savings = totalInc > 0 ? Math.max(0, Math.round(((totalInc - totalExp) / totalInc) * 100)) : 0;

      document.getElementById('totalBalance').textContent = formatCurrency(netBalance);
      document.getElementById('totalIncome').textContent = '+' + formatCurrency(totalInc);
      document.getElementById('totalExpenses').textContent = '-' + formatCurrency(totalExp);
      document.getElementById('incomeCount').textContent = `${countInc} entry${countInc !== 1 ? 's' : ''}`;
      document.getElementById('expenseCount').textContent = `${countExp} entry${countExp !== 1 ? 's' : ''}`;
      document.getElementById('savingsRate').textContent = `${savings}%`;
    }

    function getFilteredTransactions() {
      const search = searchInput.value.toLowerCase();
      const typeVal = filterType.value;
      const catVal = filterCategory.value;

      return transactions.filter(t => {
        const matchesSearch = t.description.toLowerCase().includes(search);
        const matchesType = typeVal === 'all' || t.type === typeVal;
        const matchesCat = catVal === 'all' || t.category === catVal;
        return matchesSearch && matchesType && matchesCat;
      });
    }

    function renderList() {
      const filtered = getFilteredTransactions();
      txListContainer.innerHTML = '';
      document.getElementById('txCountBadge').textContent = `${filtered.length} of ${transactions.length} items`;

      if (filtered.length === 0) {
        txListContainer.innerHTML = `
          <div class="empty-state">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
            </svg>
            <p>No transactions found.</p>
          </div>
        `;
        return;
      }

      filtered.forEach(tx => {
        const catInfo = getCategoryInfo(tx.category);
        const item = document.createElement('div');
        item.className = 'tx-item animate-in';
        item.innerHTML = `
          <div class="tx-info">
            <div class="tx-badge ${tx.type}">${catInfo.icon}</div>
            <div class="tx-details">
              <span class="tx-title">${escapeHtml(tx.description)}</span>
              <span class="tx-meta">
                <span>${formatDate(tx.date)}</span> • 
                <span class="tx-category-tag">${catInfo.name}</span>
              </span>
            </div>
          </div>
          <div class="tx-amount-group">
            <span class="tx-amount ${tx.type}">
              ${tx.type === 'income' ? '+' : '-'}${formatCurrency(tx.amount)}
            </span>
            <button type="button" class="btn-delete" data-id="${tx.id}" title="Delete">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
              </svg>
            </button>
          </div>
        `;

        item.querySelector('.btn-delete').addEventListener('click', () => deleteTransaction(tx.id));
        txListContainer.appendChild(item);
      });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // HTML5 Canvas Horizontal Bar Chart Renderer
    function drawChart() {
      const rect = canvas.parentNode.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      const width = rect.width;
      const height = rect.height;

      ctx.clearRect(0, 0, width, height);

      // Group Expenses by Category
      const expTotals = {};
      transactions.filter(t => t.type === 'expense').forEach(t => {
        expTotals[t.category] = (expTotals[t.category] || 0) + t.amount;
      });

      const categories = Object.keys(expTotals).map(catId => ({
        id: catId,
        amount: expTotals[catId],
        info: getCategoryInfo(catId)
      })).sort((a, b) => b.amount - a.amount);

      if (categories.length === 0) {
        ctx.fillStyle = '#94a3b8';
        ctx.font = '14px Plus Jakarta Sans, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('No expense data to display chart', width / 2, height / 2);
        return;
      }

      // Render Top 5 Expenses or fit in view
      const displayCats = categories.slice(0, 5);
      const maxAmount = Math.max(...displayCats.map(c => c.amount));
      
      const paddingLeft = 110;
      const paddingRight = 80;
      const paddingTop = 20;
      const barHeight = 22;
      const barGap = 24;

      displayCats.forEach((cat, index) => {
        const y = paddingTop + index * (barHeight + barGap);
        const barWidth = Math.max(10, ((width - paddingLeft - paddingRight) * (cat.amount / maxAmount)));

        // Category Label
        ctx.fillStyle = '#cbd5e1';
        ctx.font = '500 13px Plus Jakarta Sans, sans-serif';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        const labelText = `${cat.info.icon} ${cat.info.name}`;
        ctx.fillText(labelText.length > 14 ? labelText.slice(0, 14) + '…' : labelText, paddingLeft - 12, y + barHeight / 2);

        // Bar Background Track
        ctx.fillStyle = '#1e293b';
        roundRect(ctx, paddingLeft, y, width - paddingLeft - paddingRight, barHeight, 6, true, false);

        // Bar Fill
        ctx.fillStyle = cat.info.color || '#f43f5e';
        roundRect(ctx, paddingLeft, y, barWidth, barHeight, 6, true, false);

        // Amount Label
        ctx.fillStyle = '#f8fafc';
        ctx.font = '600 12px Plus Jakarta Sans, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(formatCurrency(cat.amount), paddingLeft + barWidth + 10, y + barHeight / 2);
      });
    }

    // Canvas Rounded Rect Helper
    function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
      if (typeof radius === 'number') {
        radius = {tl: radius, tr: radius, br: radius, bl: radius};
      }
      ctx.beginPath();
      ctx.moveTo(x + radius.tl, y);
      ctx.lineTo(x + width - radius.tr, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius.tr);
      ctx.lineTo(x + width, y + height - radius.br);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius.br, y + height);
      ctx.lineTo(x + radius.bl, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius.bl);
      ctx.lineTo(x, y + radius.tl);
      ctx.quadraticCurveTo(x, y, x + radius.tl, y);
      ctx.closePath();
      if (fill) ctx.fill();
      if (stroke) ctx.stroke();
    }

    function render() {
      renderSummary();
      renderList();
      drawChart();
    }

    // Run on Load
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
