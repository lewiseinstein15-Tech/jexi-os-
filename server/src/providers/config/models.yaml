# JEXI OS — provider bridge — model catalog.
#
# Per-provider model metadata: context window, max output, pricing (USD per
# 1M input / 1M output tokens), and capability flags. The CostOptimizer and
# CapabilityRouter read ONLY this table — never hardcoded names in logic.

