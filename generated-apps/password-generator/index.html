<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEXI PassGuard - Password Generator</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      
      --strength-weak: #ef4444;
      --strength-fair: #f59e0b;
      --strength-good: #10b981;
      --strength-strong: #06b6d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }

    .display-box {
      position: relative;
      background-color: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      gap: 0.5rem;
    }

    .password-field {
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.25rem;
      font-weight: 600;
      color: #38bdf8;
      background: transparent;
      border: none;
      outline: none;
      width: 100%;
      letter-spacing: 1px;
      overflow-x: auto;
    }

    .action-btns {
      display: flex;
      gap: 0.5rem;
    }

    .icon-btn {
      background-color: #334155;
      border: none;
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 0.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background-color: var(--primary);
      color: #fff;
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    /* Strength Meter */
    .strength-container {
      background: #0f172a;
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .strength-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .strength-status {
      font-weight: 700;
      color: var(--text-main);
    }

    .strength-bar-bg {
      height: 8px;
      width: 100%;
      background-color: #334155;
      border-radius: 4px;
      overflow: hidden;
    }

    .strength-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    /* Options */
    .options-group {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .option-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .option-label {
      font-size: 0.95rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .length-val {
      font-weight: 700;
      color: var(--accent);
      font-size: 1.1rem;
      background: #0f172a;
      padding: 0.2rem 0.6rem;
      border-radius: 0.375rem;
      border: 1px solid var(--card-border);
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      outline: none;
      accent-color: var(--primary);
      cursor: pointer;
      margin-top: 0.5rem;
    }

    /* Custom Checkbox Switch */
    .checkbox-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .checkbox-card {
      background: #0f172a;
      border: 1px solid var(--card-border);
      padding: 0.75rem;
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.2s;
    }

    .checkbox-card:hover {
      border-color: var(--primary);
    }

    .checkbox-card input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .checkbox-card span {
      font-size: 0.875rem;
    }

    .generate-btn {
      width: 100%;
      padding: 0.875rem;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .generate-btn:hover {
      background-color: var(--primary-hover);
    }

    .generate-btn:active {
      transform: scale(0.99);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background-color: #10b981;
      color: #fff;
      padding: 0.6rem 1.25rem;
      border-radius: 2rem;
      font-size: 0.875rem;
      font-weight: 600;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 100;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* History drawer */
    .history-section {
      margin-top: 1.5rem;
      border-top: 1px solid var(--card-border);
      padding-top: 1rem;
    }

    .history-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      max-height: 110px;
      overflow-y: auto;
    }

    .history-item {
      background: #0f172a;
      padding: 0.4rem 0.75rem;
      border-radius: 0.375rem;
      font-family: monospace;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
    }

    .history-item:hover {
      color: var(--text-main);
    }

    .history-copy {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 0.75rem;
      padding: 0.2rem 0.4rem;
    }

    .clear-history {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 0.75rem;
    }

    @media (max-width: 480px) {
      .checkbox-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        PassGuard
      </h1>
      <p>Generate secure, random passwords instantly</p>
    </div>

    <div class="display-box">
      <input type="text" id="password-output" class="password-field" readonly placeholder="Click Generate">
      <div class="action-btns">
        <button type="button" class="icon-btn" id="copy-btn" title="Copy to Clipboard">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        </button>
      </div>
    </div>

    <div class="strength-container">
      <div class="strength-header">
        <span>Strength</span>
        <span id="strength-text" class="strength-status">-</span>
      </div>
      <div class="strength-bar-bg">
        <div id="strength-bar" class="strength-bar-fill"></div>
      </div>
    </div>

    <div class="options-group">
      <div>
        <div class="option-row">
          <span class="option-label">Character Length</span>
          <span id="length-val" class="length-val">16</span>
        </div>
        <input type="range" id="length-slider" min="6" max="64" value="16">
      </div>

      <div class="checkbox-grid">
        <label class="checkbox-card">
          <span>Uppercase (A-Z)</span>
          <input type="checkbox" id="opt-upper" checked>
        </label>
        <label class="checkbox-card">
          <span>Lowercase (a-z)</span>
          <input type="checkbox" id="opt-lower" checked>
        </label>
        <label class="checkbox-card">
          <span>Numbers (0-9)</span>
          <input type="checkbox" id="opt-numbers" checked>
        </label>
        <label class="checkbox-card">
          <span>Symbols (!@#$)</span>
          <input type="checkbox" id="opt-symbols" checked>
        </label>
      </div>

      <label class="checkbox-card">
        <span>Exclude Similar (i, l, 1, O, 0)</span>
        <input type="checkbox" id="opt-exclude-similar">
      </label>
    </div>

    <button type="button" id="generate-btn" class="generate-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path></svg>
      Generate Password
    </button>

    <div class="history-section">
      <div class="history-title">
        <span>Recent Passwords</span>
        <button type="button" class="clear-history" id="clear-history-btn">Clear</button>
      </div>
      <ul class="history-list" id="history-list">
        <!-- History items dynamically added -->
      </ul>
    </div>
  </div>

  <div id="toast" class="toast">Copied to clipboard!</div>

  <script>
    const CHAR_SETS = {
      upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      lower: 'abcdefghijklmnopqrstuvwxyz',
      numbers: '0123456789',
      symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
    };

    const SIMILAR_CHARS = /[il1Lo0O]/g;

    // Elements
    const passwordOutput = document.getElementById('password-output');
    const copyBtn = document.getElementById('copy-btn');
    const generateBtn = document.getElementById('generate-btn');
    const lengthSlider = document.getElementById('length-slider');
    const lengthVal = document.getElementById('length-val');
    
    const optUpper = document.getElementById('opt-upper');
    const optLower = document.getElementById('opt-lower');
    const optNumbers = document.getElementById('opt-numbers');
    const optSymbols = document.getElementById('opt-symbols');
    const optExcludeSimilar = document.getElementById('opt-exclude-similar');

    const strengthText = document.getElementById('strength-text');
    const strengthBar = document.getElementById('strength-bar');
    const toast = document.getElementById('toast');
    const historyList = document.getElementById('history-list');
    const clearHistoryBtn = document.getElementById('clear-history-btn');

    let passwordHistory = [];

    // Sync Slider Text
    lengthSlider.addEventListener('input', (e) => {
      lengthVal.textContent = e.target.value;
      generatePassword();
    });

    // Checkbox Listeners
    [optUpper, optLower, optNumbers, optSymbols, optExcludeSimilar].forEach(input => {
      input.addEventListener('change', () => generatePassword());
    });

    // Cryptographically Secure Password Generation
    function generatePassword() {
      const length = parseInt(lengthSlider.value, 10);
      let availableChars = '';

      if (optUpper.checked) availableChars += CHAR_SETS.upper;
      if (optLower.checked) availableChars += CHAR_SETS.lower;
      if (optNumbers.checked) availableChars += CHAR_SETS.numbers;
      if (optSymbols.checked) availableChars += CHAR_SETS.symbols;

      if (optExcludeSimilar.checked) {
        availableChars = availableChars.replace(SIMILAR_CHARS, '');
      }

      if (!availableChars) {
        passwordOutput.value = 'Select at least 1 option';
        updateStrength('', 0);
        return;
      }

      let password = '';
      const randomValues = new Uint32Array(length);
      window.crypto.getRandomValues(randomValues);

      for (let i = 0; i < length; i++) {
        password += availableChars[randomValues[i] % availableChars.length];
      }

      passwordOutput.value = password;
      evaluateStrength(password, availableChars.length);
      addToHistory(password);
    }

    // Calculate Entropy & Update Strength UI
    function evaluateStrength(password, poolSize) {
      if (!password) {
        updateStrength('None', 0, '#334155');
        return;
      }

      const length = password.length;
      // Entropy = L * log2(R)
      const entropy = length * (Math.log2(poolSize || 1));

      if (entropy < 28) {
        updateStrength('Very Weak', 20, 'var(--strength-weak)');
      } else if (entropy < 45) {
        updateStrength('Weak', 40, 'var(--strength-weak)');
      } else if (entropy < 65) {
        updateStrength('Medium', 65, 'var(--strength-fair)');
      } else if (entropy < 90) {
        updateStrength('Strong', 85, 'var(--strength-good)');
      } else {
        updateStrength('Very Strong', 100, 'var(--strength-strong)');
      }
    }

    function updateStrength(label, percent, color) {
      strengthText.textContent = label;
      strengthText.style.color = color || 'var(--text-main)';
      strengthBar.style.width = `${percent}%`;
      strengthBar.style.backgroundColor = color;
    }

    // Copy Functionality
    function copyToClipboard(text) {
      if (!text || text === 'Select at least 1 option') return;
      navigator.clipboard.writeText(text).then(() => {
        showToast();
      }).catch(err => {
        // Fallback
        passwordOutput.select();
        document.execCommand('copy');
        showToast();
      });
    }

    function showToast() {
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    // History Management
    function addToHistory(pwd) {
      if (!pwd || pwd === 'Select at least 1 option') return;
      if (passwordHistory[0] === pwd) return; // Prevent duplicate consecutive entries

      passwordHistory.unshift(pwd);
      if (passwordHistory.length > 5) passwordHistory.pop();
      renderHistory();
    }

    function renderHistory() {
      historyList.innerHTML = '';
      passwordHistory.forEach((pwd) => {
        const li = document.createElement('li');
        li.className = 'history-item';
        
        const masked = pwd.length > 18 ? pwd.substring(0, 15) + '...' : pwd;
        
        li.innerHTML = `
          <span>${escapeHtml(masked)}</span>
          <button type="button" class="history-copy">Copy</button>
        `;
        
        li.querySelector('.history-copy').addEventListener('click', () => {
          copyToClipboard(pwd);
        });
        
        historyList.appendChild(li);
      });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Event Listeners
    generateBtn.addEventListener('click', generatePassword);
    copyBtn.addEventListener('click', () => copyToClipboard(passwordOutput.value));
    clearHistoryBtn.addEventListener('click', () => {
      passwordHistory = [];
      renderHistory();
    });

    // Initial Load
    generatePassword();
  </script>
</body>
</html>
