# Build JEXI OS as a real Android APK — FREE (GitHub Actions free tier,
# no credit card, no Play Store needed). The APK is downloadable from the
# workflow's Artifacts and installable directly on any Android 7.0+ phone.
#
# How it works:
#   1. Builds the React/Vite web app (pointed at the Render backend)
#   2. Syncs it into the Capacitor Android shell
#   3. Compiles a debug-signed APK with the Android SDK
#   4. Uploads the APK as an artifact you can download and install
#
# Getting the APK after a run:
#   Repo -> Actions -> "Build JEXI OS APK" -> latest run -> Artifacts ->
#   download "jexi-os-apk" -> unzip -> install app-debug.apk on your phone.

name: Build JEXI OS APK

on:
  push:
    branches: [ main ]
    # B123 — build on EVERY push to main so every deploy ships a fresh APK
    # release (apk-build-NN): the in-app UpdateBanner then always has a newer
    # build to offer, including after server-only/plugin changes.
    paths-ignore:
      - 'FIXLOG-*.md'
      - 'docs/**'
      - '*.md'
  # Manual "Rebuild APK" button in the Actions tab (no code change needed).
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # allow publishing the APK to a GitHub Release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java (Android build)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Capacitor 8 requires JDK 21 (compiles with source/target 21)
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web app and sync into Android shell
        env:
          # Point the app at the free Render backend (same as the Pages deploy).
          # Change this if your Render service URL differs.
          VITE_JEXI_BACKEND_URL: https://jexi-os-brain.onrender.com
          # Bake this build's identity into the APK so the in-app auto-update
          # checker can compare it with the newest GitHub Release and notify the
          # user when a newer build is published.
          VITE_APP_VERSION: apk-build-${{ github.run_number }}
          VITE_BUILD_SHA: ${{ github.sha }}
        run: |
          npm run build
          npx cap sync android

      - name: Compile debug APK
        working-directory: android
        env:
          # Bake the GitHub run number into versionCode so every APK is a
          # strictly newer version than the last (Android refuses equal/lower).
          APK_BUILD_NUMBER: ${{ github.run_number }}
        # Retry: the very first Gradle wrapper download (gradle-8.14.3-all.zip)
        # has hit transient HTTP 503s on the distribution mirror, which killed
        # two consecutive builds and left the published APK stuck on an old
        # build number. Three attempts with a backoff make a blip survivable.
        run: |
          for attempt in 1 2 3; do
            echo "--- Gradle build attempt $attempt of 3 ---"
            if ./gradlew assembleDebug --no-daemon; then
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              echo "--- build failed (transient download or compile error?), retrying in 20s ---"
              sleep 20
            fi
          done
          echo "Gradle build failed after 3 attempts"
          exit 1

      - name: Upload APK artifact (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: jexi-os-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Publish to a Release so there is a permanent public download link:
      #   https://github.com/lewiseinstein15-Tech/jexi-os-/releases/latest/download/app-debug.apk
      # Every build becomes the new "Latest" release. No login needed to download.
      # Done with the preinstalled `gh` CLI (auto-authenticated via GITHUB_TOKEN)
      # instead of a third-party action: a softprops/action-gh-release tarball
      # download failure once killed builds at the "Prepare actions" stage before
      # any code ran (codeload flake), so this step has no external action dep.
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="apk-build-${{ github.run_number }}"
          # Reruns reuse the same run_number → clean a previous release/tag first.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          cat > /tmp/release-notes.md <<'EOF'
          Latest **JEXI OS** Android app. Free, no Play Store, no credit card.

          **Install:** download `app-debug.apk`, open it on your phone, allow
          "install from this source", tap Install. Supports Android 7.0+.

          Direct link (always the newest build):
          https://github.com/lewiseinstein15-Tech/jexi-os-/releases/latest/download/app-debug.apk
          EOF
          # B114-fix — the release API is occasionally flaky (HTTP 503 seen on
          # 2026-08-17); retry transient failures before failing the build.
          for attempt in 1 2 3 4 5; do
            if gh release create "$TAG" \
              android/app/build/outputs/apk/debug/app-debug.apk \
              --title "JEXI OS Android App — build #${{ github.run_number }}" \
              --notes-file /tmp/release-notes.md \
              --latest 2>/tmp/gh-release-err.txt; then
              echo "Release $TAG published."
              exit 0
            fi
            err=$(cat /tmp/gh-release-err.txt || true)
            echo "gh release create attempt $attempt failed: $err"
            if ! echo "$err" | grep -qE '5[0-9][0-9]|timed? ?out|rate.?limit|server|unavailable|temporarily|retry'; then
              echo "Non-transient failure — aborting."
              exit 1
            fi
            sleep 15
          done
          echo "Release publish failed after 5 attempts."
          exit 1
