name: build-brain-image

# Mission Scarab pipeline: every push to main builds the Suga-proven
# server/Dockerfile and publishes to GHCR — free & unlimited for public repos.
# ClawCloud Run (App Launchpad) pulls ghcr.io/lewiseinstein15-tech/jexi-os-brain:latest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Phase 7(F) — the HUD subsystem lives at the repo root (ECC layout).
      # The image context is server/, so ship events/hud into it: the container
      # resolves /app/events/hud and the HUD contract deploys with the brain.
      - name: Ship events/hud into the server build context
        run: |
          mkdir -p server/events
          cp -r events/hud server/events/

      # Phase 7(G) — same story for the commands subsystem: the container
      # resolves /app/commands and the 12 slash commands deploy with the brain.
      - name: Ship commands/ into the server build context
        run: |
          mkdir -p server/commands
          cp -r commands/. server/commands/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/lewiseinstein15-tech/jexi-os-brain:latest
            ghcr.io/lewiseinstein15-tech/jexi-os-brain:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
