<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HydroPulse - Water Intake Tracker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-weight-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    .wave-bg {
      position: relative;
      overflow: hidden;
    }
    .wave-bg::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--wave-height, 0%);
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.6) 0%, rgba(14, 165, 233, 0.8) 100%);
      transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 0;
      border-radius: 50%;
    }
    .wave-content {
      position: relative;
      z-index: 10;
    }
    /* Smooth ring transition */
    #progress-ring-circle {
      transition: stroke-dashoffset 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="min-h-screen py-8 px-4 flex items-center justify-center text-slate-800">

  <div class="w-full max-w-md">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 bg-sky-500 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-sky-200 animate-pulse">
          <i class="fa-solid fa-droplet text-xl"></i>
        </div>
        <div>
          <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">HydroPulse</h1>
          <p class="text-xs text-sky-600 font-semibold tracking-wider uppercase">Stay Hydrated, Stay Healthy</p>
        </div>
      </div>
      
      <!-- Settings / Unit Toggle Menu -->
      <div class="flex gap-2">
        <button id="unit-toggle" type="button" class="w-10 h-10 rounded-xl glass-card flex items-center justify-center text-slate-600 hover:text-sky-500 hover:border-sky-300 transition duration-200">
          <span class="font-bold text-sm" id="unit-toggle-label">ml</span>
        </button>
        <button id="settings-btn" type="button" class="w-10 h-10 rounded-xl glass-card flex items-center justify-center text-slate-600 hover:text-sky-500 hover:border-sky-300 transition duration-200">
          <i class="fa-solid fa-gear text-sm"></i>
        </button>
      </div>
    </div>

    <!-- Settings Modal panel (Hidden by default) -->
    <div id="settings-panel" class="hidden glass-card rounded-3xl p-6 mb-6 border border-sky-100 shadow-xl relative animate-fadeIn">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-sliders text-sky-500"></i> Adjustment Settings
        </h3>
        <button id="close-settings" type="button" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <form id="settings-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-2" id="goal-input-label">Daily Goal (ml)</label>
          <div class="relative flex items-center">
            <input type="number" id="daily-goal-input" min="100" max="10000" step="50" class="w-full px-4 py-3 bg-white/70 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-sky-500 font-bold text-slate-700">
            <span class="absolute right-4 font-semibold text-slate-400" id="goal-unit-suffix">ml</span>
          </div>
        </div>
        <div class="flex justify-end gap-2">
          <button id="save-settings" type="button" class="px-5 py-2.5 bg-sky-500 text-white font-bold rounded-xl shadow-lg shadow-sky-150 hover:bg-sky-600 active:scale-95 transition-all text-sm">Save Changes</button>
        </div>
      </form>
    </div>

    <!-- Main Progress Card -->
    <div class="glass-card rounded-[2.5rem] p-8 shadow-xl shadow-sky-100 border border-sky-100/50 relative overflow-hidden mb-6 flex flex-col items-center">
      
      <!-- Main Circular Tracker Container -->
      <div class="relative w-64 h-64 flex items-center justify-center">
        <!-- Dynamic SVG Ring -->
        <svg class="w-full h-full transform -rotate-90" viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="85" class="stroke-slate-100" stroke-width="12" fill="transparent"></circle>
          <circle id="progress-ring-circle" cx="100" cy="100" r="85" class="stroke-sky-500" stroke-width="12" stroke-linecap="round" fill="transparent" stroke-dasharray="534" stroke-dashoffset="534"></circle>
        </svg>

        <!-- Internal Dashboard -->
        <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
          <div class="p-3 bg-sky-50 rounded-full text-sky-500 mb-2 scale-100 hover:scale-110 transition duration-300 cursor-pointer" id="droplet-icon">
            <i class="fa-solid fa-glass-water text-3xl"></i>
          </div>
          <span class="text-4xl font-extrabold text-slate-900 tracking-tight" id="current-value">0</span>
          <span class="text-sm font-semibold text-slate-400 mt-0.5" id="target-value">of 2000 ml</span>
          <div class="mt-3 px-3 py-1 bg-emerald-500/10 text-emerald-600 rounded-full text-xs font-extrabold tracking-wider uppercase" id="percentage-badge">0% Complete</div>
        </div>
      </div>

      <!-- Status Message -->
      <p id="motivational-text" class="text-center mt-6 text-sm font-semibold text-slate-500 italic px-4">"Every drop counts. Let's make today hydrated!"</p>
    </div>

    <!-- Quick Add Shortcuts & Custom Input Grid -->
    <div class="glass-card rounded-3xl p-6 shadow-xl shadow-sky-100/50 border border-sky-100/50 mb-6">
      <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Quick Hydrate</h3>
      <div class="grid grid-cols-4 gap-3 mb-6">
        <button type="button" onclick="addWater(150)" class="flex flex-col items-center p-3 bg-white hover:bg-sky-50 border border-slate-100 hover:border-sky-200 rounded-2xl shadow-sm transition active:scale-95 group">
          <i class="fa-solid fa-mug-hot text-xl text-amber-600 group-hover:scale-110 transition"></i>
          <span class="text-xs font-extrabold text-slate-700 mt-2" id="quick-150">150 ml</span>
          <span class="text-[10px] text-slate-400 font-medium mt-0.5">Tea/Coffee</span>
        </button>
        <button type="button" onclick="addWater(250)" class="flex flex-col items-center p-3 bg-white hover:bg-sky-50 border border-slate-100 hover:border-sky-200 rounded-2xl shadow-sm transition active:scale-95 group">
          <i class="fa-solid fa-glass-water-droplet text-xl text-sky-400 group-hover:scale-110 transition"></i>
          <span class="text-xs font-extrabold text-slate-700 mt-2" id="quick-250">250 ml</span>
          <span class="text-[10px] text-slate-400 font-medium mt-0.5">Glass</span>
        </button>
        <button type="button" onclick="addWater(500)" class="flex flex-col items-center p-3 bg-white hover:bg-sky-50 border border-slate-100 hover:border-sky-200 rounded-2xl shadow-sm transition active:scale-95 group">
          <i class="fa-solid fa-bottle-water text-xl text-sky-500 group-hover:scale-110 transition"></i>
          <span class="text-xs font-extrabold text-slate-700 mt-2" id="quick-500">500 ml</span>
          <span class="text-[10px] text-slate-400 font-medium mt-0.5">Bottle</span>
        </button>
        <button type="button" onclick="addWater(750)" class="flex flex-col items-center p-3 bg-white hover:bg-sky-50 border border-slate-100 hover:border-sky-200 rounded-2xl shadow-sm transition active:scale-95 group">
          <i class="fa-solid fa-faucet-drip text-xl text-indigo-500 group-hover:scale-110 transition"></i>
          <span class="text-xs font-extrabold text-slate-700 mt-2" id="quick-750">750 ml</span>
          <span class="text-[10px] text-slate-400 font-medium mt-0.5">Flask</span>
        </button>
      </div>

      <!-- Custom Intake Form -->
      <form class="flex gap-2" id="custom-form">
        <div class="relative flex-1">
          <input type="number" id="custom-amount-input" placeholder="Custom amount..." min="1" max="5000" class="w-full px-4 py-3 bg-white/70 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-400 rounded-2xl font-semibold text-sm text-slate-700">
          <span class="absolute right-4 top-1/2 -translate-y-1/2 font-bold text-slate-400 text-xs" id="custom-unit-label">ml</span>
        </div>
        <button type="button" id="custom-add-btn" class="px-6 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-2xl flex items-center justify-center gap-2 active:scale-95 transition-all text-sm">
          <i class="fa-solid fa-plus"></i> Add
        </button>
      </form>
    </div>

    <!-- History List Card -->
    <div class="glass-card rounded-3xl p-6 shadow-xl shadow-sky-100/50 border border-sky-100/50">
      <div class="flex justify-between items-center mb-4">
        <div>
          <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Today's Logs</h3>
          <span class="text-xs text-sky-500 font-semibold" id="history-summary">0 logs recorded</span>
        </div>
        <button id="clear-all-btn" type="button" class="text-xs font-bold text-rose-500 hover:text-rose-600 flex items-center gap-1 bg-rose-50 hover:bg-rose-100 px-3 py-1.5 rounded-xl transition duration-200">
          <i class="fa-regular fa-trash-can"></i> Reset Today
        </button>
      </div>

      <!-- Dynamic History Items -->
      <div id="history-container" class="space-y-2.5 max-h-60 overflow-y-auto pr-1">
        <!-- Empty state placeholder -->
        <div id="empty-state" class="flex flex-col items-center justify-center py-8 text-slate-400">
          <i class="fa-solid fa-feather text-2xl mb-2 text-slate-300"></i>
          <span class="text-xs font-semibold">No hydration records found for today.</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Custom Audio Context sound simulation -->
  <script>
    // Audio effects engine using native Web Audio API
    const playWaterSound = (isReset = false) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (isReset) {
          // Lower pitch sweep for delete/reset
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        } else {
          // Upward water droplet synth bubble effect
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gainNode = ctx.createGain();

          osc1.connect(gainNode);
          osc2.connect(gainNode);
          gainNode.connect(ctx.destination);

          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(600, ctx.currentTime);
          osc1.frequency.exponentialRampToValueAtTime(1400, ctx.currentTime + 0.15);

          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(300, ctx.currentTime);
          osc2.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.15);

          gainNode.gain.setValueAtTime(0.15, ctx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);

          osc1.start();
          osc2.start();
          osc1.stop(ctx.currentTime + 0.2);
          osc2.stop(ctx.currentTime + 0.2);
        }
      } catch (e) {
        console.log('Audio Context is not yet initialized or supported.', e);
      }
    };
  </script>

  <!-- Application Core Script -->
  <script>
    // Global State management
    let unit = localStorage.getItem('hydro_unit') || 'ml'; // ml or oz
    let goal = parseInt(localStorage.getItem('hydro_goal')) || 2000; // in ml
    let logs = JSON.parse(localStorage.getItem('hydro_logs')) || []; 

    // Conversion helpers
    const ML_TO_OZ = 0.033814;
    const OZ_TO_ML = 29.5735;

    // Formatting values
    function formatAmount(mlAmount) {
      if (unit === 'oz') {
        return `${Math.round(mlAmount * ML_TO_OZ)} oz`;
      }
      return `${mlAmount} ml`;
    }

    // Render application state
    function render() {
      const todayStr = new Date().toDateString();
      const todayLogs = logs.filter(log => new Date(log.timestamp).toDateString() === todayStr);
      const totalML = todayLogs.reduce((acc, curr) => acc + curr.amount, 0);
      
      // Goal visual computation
      const percent = Math.min(Math.round((totalML / goal) * 100), 1000); // Allow exceeding 100% inside text indicator
      const visualPercent = Math.min(percent, 100); 

      // SVG Stroke Ring formula 
      // r=85 => circumference = 2 * PI * 85 = 534.07
      const circumference = 534;
      const offset = circumference - (visualPercent / 100) * circumference;
      const ring = document.getElementById('progress-ring-circle');
      ring.style.strokeDashoffset = offset;

      // Update numbers
      document.getElementById('current-value').textContent = formatAmount(totalML);
      document.getElementById('target-value').textContent = `of ${formatAmount(goal)}`;
      
      // Percentage & color indicator
      const badge = document.getElementById('percentage-badge');
      badge.textContent = `${percent}% Complete`;
      
      if (percent >= 100) {
        badge.className = "mt-3 px-3 py-1 bg-amber-500/10 text-amber-600 rounded-full text-xs font-extrabold tracking-wider uppercase animate-bounce";
        ring.classList.replace('stroke-sky-500', 'stroke-amber-500');
      } else {
        badge.className = "mt-3 px-3 py-1 bg-sky-500/10 text-sky-600 rounded-full text-xs font-extrabold tracking-wider uppercase";
        ring.classList.replace('stroke-amber-500', 'stroke-sky-500');
      }

      // Motivational Quotes based on progress
      const motivators = [
        "Starting fresh! Every glass is a victory.",
        "Keep going! You're building a healthy momentum.",
        "Awesome progress! Your cells are celebrating.",
        "You're absolute hydration royalty! Goal met! 🎉"
      ];
      let quoteIndex = 0;
      if (percent >= 100) quoteIndex = 3;
      else if (percent >= 75) quoteIndex = 2;
      else if (percent >= 25) quoteIndex = 1;
      document.getElementById('motivational-text').textContent = `"${motivators[quoteIndex]}"`;

      // Update configurations UI elements
      document.getElementById('unit-toggle-label').textContent = unit;
      document.getElementById('goal-input-label').textContent = `Daily Goal (${unit})`;
      document.getElementById('goal-unit-suffix').textContent = unit;
      
      // Update quick input text labels dynamically
      document.getElementById('quick-150').textContent = formatAmount(150);
      document.getElementById('quick-250').textContent = formatAmount(250);
      document.getElementById('quick-500').textContent = formatAmount(500);
      document.getElementById('quick-750').textContent = formatAmount(750);
      document.getElementById('custom-unit-label').textContent = unit;

      // Settings Input display configuration value
      const goalInput = document.getElementById('daily-goal-input');
      if (unit === 'oz') {
        goalInput.value = Math.round(goal * ML_TO_OZ);
      } else {
        goalInput.value = goal;
      }

      // Render history items
      const container = document.getElementById('history-container');
      const emptyState = document.getElementById('empty-state');
      container.innerHTML = '';
      
      if (todayLogs.length === 0) {
        container.appendChild(emptyState);
        document.getElementById('history-summary').textContent = `0 logs recorded`;
      } else {
        document.getElementById('history-summary').textContent = `${todayLogs.length} logs recorded today`;
        todayLogs.slice().reverse().forEach(log => {
          const item = document.createElement('div');
          item.className = 'flex items-center justify-between p-3 bg-white/70 hover:bg-white rounded-2xl border border-slate-100 transition shadow-sm animate-fadeIn duration-200';
          
          const timeFormatted = new Date(log.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          
          // Compute cup styling
          let iconType = 'fa-glass-water';
          if (log.amount >= 750) iconType = 'fa-faucet-drip';
          else if (log.amount >= 500) iconType = 'fa-bottle-water';
          else if (log.amount <= 150) iconType = 'fa-mug-hot';

          item.innerHTML = `
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 bg-sky-50 rounded-xl flex items-center justify-center text-sky-500">
                <i class="fa-solid ${iconType}"></i>
              </div>
              <div>
                <span class="text-sm font-bold text-slate-800">${formatAmount(log.amount)}</span>
                <span class="text-[10px] text-slate-400 font-bold block">${timeFormatted}</span>
              </div>
            </div>
            <button type="button" onclick="deleteLog(${log.id})" class="w-8 h-8 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-500 hover:text-rose-600 flex items-center justify-center transition active:scale-95">
              <i class="fa-regular fa-trash-can text-xs"></i>
            </button>
          `;
          container.appendChild(item);
        });
      }
    }

    // Controller functions
    function addWater(amountML) {
      const previousTotal = logs
        .filter(log => new Date(log.timestamp).toDateString() === new Date().toDateString())
        .reduce((acc, curr) => acc + curr.amount, 0);

      const log = {
        id: Date.now() + Math.random(),
        amount: amountML,
        timestamp: new Date().toISOString()
      };

      logs.push(log);
      localStorage.setItem('hydro_logs', JSON.stringify(logs));
      playWaterSound(false);
      
      // Check target achievements and fire confetti!
      const currentTotal = previousTotal + amountML;
      if (currentTotal >= goal && previousTotal < goal) {
        triggerConfetti();
      }

      render();
    }

    function deleteLog(id) {
      logs = logs.filter(log => log.id !== id);
      localStorage.setItem('hydro_logs', JSON.stringify(logs));
      playWaterSound(true);
      render();
    }

    function triggerConfetti() {
      confetti({
        particleCount: 150,
        spread: 80,
        origin: { y: 0.6 },
        colors: ['#0ea5e9', '#38bdf8', '#0284c7', '#7dd3fc', '#f59e0b']
      });
    }

    // Event Handlers Setup
    document.addEventListener('DOMContentLoaded', () => {
      render();

      // Unit Selector toggle logic
      document.getElementById('unit-toggle').addEventListener('click', () => {
        unit = (unit === 'ml') ? 'oz' : 'ml';
        localStorage.setItem('hydro_unit', unit);
        render();
      });

      // Settings modal toggles
      const settingsPanel = document.getElementById('settings-panel');
      document.getElementById('settings-btn').addEventListener('click', () => {
        settingsPanel.classList.toggle('hidden');
      });
      document.getElementById('close-settings').addEventListener('click', () => {
        settingsPanel.classList.add('hidden');
      });

      // Save configurations
      document.getElementById('save-settings').addEventListener('click', () => {
        const inputVal = parseFloat(document.getElementById('daily-goal-input').value);
        if (isNaN(inputVal) || inputVal <= 0) return;

        if (unit === 'oz') {
          goal = Math.round(inputVal * OZ_TO_ML);
        } else {
          goal = inputVal;
        }
        
        localStorage.setItem('hydro_goal', goal);
        settingsPanel.classList.add('hidden');
        render();
      });

      // Custom intake manual logs
      document.getElementById('custom-add-btn').addEventListener('click', () => {
        const inputField = document.getElementById('custom-amount-input');
        const value = parseFloat(inputField.value);
        if (isNaN(value) || value <= 0) return;

        let calculatedML = value;
        if (unit === 'oz') {
          calculatedML = Math.round(value * OZ_TO_ML);
        }

        addWater(calculatedML);
        inputField.value = '';
      });

      // Clear daily session tracker logic
      document.getElementById('clear-all-btn').addEventListener('click', () => {
        if (confirm("Reset your progress for today?")) {
          const todayStr = new Date().toDateString();
          // Filter out only today's data records
          logs = logs.filter(log => new Date(log.timestamp).toDateString() !== todayStr);
          localStorage.setItem('hydro_logs', JSON.stringify(logs));
          playWaterSound(true);
          render();
        }
      });
    });
  </script>
</body>
</html>
