name: Deploy Frontend to GitHub Pages
# DISABLED push trigger 2026-09-22 (CI failure sweep):
# GitHub Pages is DISABLED at the repo level — actions/deploy-pages@v4 fails
# with "Failed to create deployment (status: 404) ... Ensure GitHub Pages has
# been enabled" on every push (see keepalive.yml B216-1 notes: the site was
# found disabled before, cause never identified). The build job succeeds; the
# deploy job can never succeed until Pages is re-enabled in repo Settings by
# the owner (ENV item — reported to lead). Manual runs only until then.
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and Build
        # Point the free GitHub Pages frontend at the Render backend.
        # Change this if your Render service URL differs.
        env:
          VITE_JEXI_BACKEND_URL: ${{ vars.BACKEND_URL || 'https://jexi-brain-image.onrender.com' }}
        run: |
          npm ci
          npm run build
          # B179 — brain.json: the APKs' lifeline. If the brain ever moves,
          # installed apps fetch this and self-heal.
          printf '{\"brain\": \"%s\"}' "${{ vars.BACKEND_URL || 'https://jexi-brain-image.onrender.com' }}" > dist/brain.json
          cat dist/brain.json
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
