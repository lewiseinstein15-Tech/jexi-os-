# ⚠️ NOTE (July 2026): Hugging Face now requires a paid PRO plan to CREATE Docker
# Spaces — the free tier only allows static Spaces (API returns 402). This
# workflow only works with a PRO account, or if HF reverses the policy.
#
# Deploy JEXI OS to a Hugging Face Space.
#
# First-time setup (2 minutes):
#   1. Create an account at huggingface.co (email only — no card).
#   2. In GitHub repo settings, add a repository secret:
#        Name:  HF_TOKEN
#        Value: an HF access token (huggingface.co/settings/tokens -> "Write" role)
#   3. Run this workflow from the Actions tab. It asks for your Space ID,
#      e.g.  your-username/jexi-os   (the Space is created automatically).
#
# The Space builds this repo's ROOT Dockerfile server-side with the default
# build args, i.e. INSTALL_BROWSER=0 / INSTALL_MEDIA=0 (cleanup v2 2026-09:
# corrected - an earlier version of this note claimed Chromium libs install;
# they do not under the 0/0 defaults). A `--build-arg INSTALL_BROWSER=1
# INSTALL_MEDIA=1` is NOT possible from this workflow: it never runs
# `docker build` - `huggingface-cli upload` only ships the repo and HF's
# builder applies the Dockerfile defaults (HF Spaces has no build-arg
# channel). To get browser/media on a Space: fork the Dockerfile with the
# args flipped, or point the Space at a prebuilt image. URL:
#   https://<your-username>-jexi-os.hf.space  (check /api/health)
# Add GROQ_API_KEY / GEMINI_API_KEY under the Space's "Settings -> Variables".

name: Deploy to Hugging Face Spaces

on:
  workflow_dispatch:
    inputs:
      space_id:
        description: 'Your HF Space ID (username/space-name)'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_ID: ${{ github.event.inputs.space_id }}
        run: |
          pip install --upgrade huggingface_hub
          huggingface-cli upload "$SPACE_ID" . --repo-type=space \
            --exclude ".git/*" --exclude ".github/*" \
            --exclude "node_modules/*" --exclude "dist/*" \
            --exclude "server/node_modules/*" \
            --exclude "server/data/*" --exclude "server/jexi-workspace/*" \
            --exclude "server/public/*" --exclude ".env" --exclude "*.log"
