# Render Blueprint — JEXI OS Backend ("Brain")
# Deploy: https://dashboard.render.com/select-repo?type=web (pick this repo)
# Render auto-detects this file and pre-fills the service below.
#
# The frontend lives on Vercel; this web service is the API + virtual desktop backend.
services:
  - type: web
    name: jexi-os-brain
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    # Install deps first; if the apt/deps step fails on Render's build image,
    # still download the browser so the build can't be killed by it.
    # PLAYWRIGHT_BROWSERS_PATH=0 puts Chromium inside node_modules (persists to runtime).
    buildCommand: npm ci && (PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium || PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install chromium)
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Pin the Node version used for build AND runtime.
      - key: NODE_VERSION
        value: 22
      # Chromium needs a writable home dir for its user-data/profile cache.
      - key: HOME
        value: /tmp
      # Keep Chromium inside node_modules so it survives build -> runtime.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      # Set these in the Render dashboard (secrets) — or paste them below:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      # OPTIONAL but recommended: lock the API with a secret key. When set, every
      # /api request must carry the x-jexi-key header (set it in the app's
      # Settings → JEXI Access Key). Protects your AI quota from strangers.
      - key: JEXI_API_KEY
        sync: false
      # Optional: comma-separated browser origins allowed to call the API
      # (e.g. https://lewiseinstein15-tech.github.io). Unset = open.
      - key: CORS_ORIGINS
        sync: false
      # Optional: point the frontend at this service without touching code.
      # After deploy, set VITE_JEXI_BACKEND_URL on Vercel to your onrender.com URL.
