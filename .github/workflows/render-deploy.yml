# Deploy the JEXI OS backend ("Brain") to Render on every server change.
#
# Requires ONE repo secret (never commit the hook key — the repo is public):
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#   Name:  RENDER_DEPLOY_HOOK
#   Value: https://api.render.com/deploy/srv-daa3bie7bikc73fal0kg?key=<your-key>
#          (the CURRENT brain home — jexi-brain-image; RENDER_IMAGE_DEPLOY_HOOK
#           in docker-publish.yml/self-deploy.yml points here too)
#
# Until the secret exists, the step warns and exits 0 (safe no-op).

name: Deploy Backend to Render

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - 'package.json'
      - 'render.yaml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK secret is not set — add it in repo Settings → Secrets to enable auto-deploy to Render."
            exit 0
          fi
          echo "Pinging Render deploy hook..."
          curl -sS -m 60 -X POST "$HOOK" -H "Accept: application/json" -w "\nHTTP %{http_code}\n"
