name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prompt Defense Baseline lint
        working-directory: .
        run: bash scripts/lint-agent-baseline.sh
      - name: Install
        run: npm ci
      - name: Install root deps (rich-render test needs react/react-markdown/esbuild)
        working-directory: .
        run: npm ci
      - name: Syntax check
        run: |
          for f in index.js src/services/*.js; do node --check "$f"; done
      - name: Lint (error-level rules — no-undef, redeclaration, unsafe patterns)
        run: npm run lint
      - name: Run all test suites
        run: npm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

  cross-harness:
    name: Cross-harness convert + install check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Convert all harnesses (strict — canonical errors fail CI)
        run: bash scripts/convert-harnesses.sh --strict
      - name: Install dry-run (detection + skip-cleanly check)
        run: bash scripts/install-harnesses.sh --dry-run
      - name: Idempotency check (install twice into a test root, second run must be 0 writes)
        run: |
          bash scripts/install-harnesses.sh --root /tmp/jexi-ci-harness --force > /tmp/run1.txt
          bash scripts/install-harnesses.sh --root /tmp/jexi-ci-harness --force > /tmp/run2.txt
          SECOND_WRITES=$(grep -oE '[0-9]+ created, [0-9]+ changed' /tmp/run2.txt | tail -1)
          echo "second-run writes: ${SECOND_WRITES}"
          test "${SECOND_WRITES}" = "0 created, 0 changed"
