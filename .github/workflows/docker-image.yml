name: build-brain-image

# Mission Scarab pipeline: every push to main builds the Suga-proven
# server/Dockerfile and publishes to GHCR — free & unlimited for public repos.
# ClawCloud Run (App Launchpad) pulls ghcr.io/lewiseinstein15-tech/jexi-os-brain:latest

on:
  push:
    # FIX (cleanup v2, 2026-09): the push trigger was born broken at f1733516
    # as `branches: ain]` (a mangled main-array literal), so it never fired;
    # the workflow only ever ran via workflow_dispatch. Restored to the
    # documented intent (header: "every push to main builds ... GHCR").
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Phase 7(F) — the HUD subsystem lives at runtime/events/hud (ECC layout).
      # runtime/events is now copied whole by server/Dockerfile; this staging
      # additionally feeds the legacy /app/server/events/hud probe path.
      - name: Ship events/hud into the server build context
        run: |
          mkdir -p server/events
          cp -r runtime/events/hud server/events/

      # Phase 7(G) — same story for the commands subsystem (capabilities/commands):
      # copied whole by server/Dockerfile; staged copy feeds /app/server/commands.
      - name: Ship commands/ into the server build context
        run: |
          mkdir -p server/commands
          cp -r capabilities/commands/. server/commands/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/lewiseinstein15-tech/jexi-os-brain:latest
            ghcr.io/lewiseinstein15-tech/jexi-os-brain:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
