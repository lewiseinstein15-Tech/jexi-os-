apply plugin: 'com.android.application'

android {
    namespace = "com.jexi.os"
    compileSdk = rootProject.ext.compileSdkVersion
    // B152 — AGP 8+ doesn't generate BuildConfig by default; MainActivity uses
    // BuildConfig.VERSION_CODE to clear the WebView cache on upgrades.
    buildFeatures {
        buildConfig true
    }

    // Every build signs with the SAME committed keystore so a new APK installs
    // over the previous one. (Gradle's default auto-generated debug key is a
    // NEW random key on every CI machine — that mismatch caused
    // "App not installed as package conflicts with an existing package".)
    signingConfigs {
        debug {
            storeFile file('jexi-debug.p12')
            storePassword 'jexi-debug-2026'
            keyAlias 'jexidebug'
            keyPassword 'jexi-debug-2026'
            storeType 'PKCS12'
        }
    }

    defaultConfig {
        applicationId "com.jexi.os"
        // minSdk 24 = Android 7.0+, so the APK installs and runs on Android
        // 14, 15 and 16 (API 34/35/36) — and everything older too.
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode MUST rise on every build or Android refuses the update.
        //
        // ⚠️ B158 — THE DOWNGRADE TRAP (why updates broke on the phone):
        // CI passes github.run_number (a small number, ~hundreds) while the
        // old local fallback used epoch SECONDS (~1.75 billion). Anyone who
        // ever installed a locally-built APK could NEVER take a CI update —
        // every Release build had a LOWER versionCode and Android rejects
        // that with INSTALL_FAILED_VERSION_DOWNGRADE ("App not installed").
        //
        // Scheme (both directions safe forever):
        //   CI builds:   1,000,000 + run_number   (always the newest)
        //   Local builds: hours since 2026-01-01  (~8,760/yr → stays under
        //                1,000,000 until the year 2139)
        // Local builds therefore can NEVER outrank a CI build again.
        def buildNumber = System.getenv('APK_BUILD_NUMBER')
        if (buildNumber == null || buildNumber.trim().isEmpty()) {
            def hoursSince2026 = (System.currentTimeMillis() / 3600000L) - 561796L  // 2026-01-01T00:00Z in epoch hours
            buildNumber = Math.max(1, (int) hoursSince2026) as int
        } else if ((buildNumber.trim() as int) < 1000000) {
            // A raw run number from CI → lift it into the CI range.
            buildNumber = 1000000 + (buildNumber.trim() as int)
        } else {
            buildNumber = buildNumber.trim() as int
        }
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
