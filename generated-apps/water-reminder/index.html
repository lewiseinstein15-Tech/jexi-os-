<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaFlow - Water Tracker & Reminders</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --primary-glow: rgba(56, 189, 248, 0.35);
      --accent: #06b6d4;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 16px 40px;
    }

    .app-container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      fill: var(--primary);
      filter: drop-shadow(0 0 6px var(--primary-glow));
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }

    .icon-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Streak Banner */
    .streak-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fbbf24;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 600;
    }

    /* Ring Section */
    .main-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      position: relative;
      overflow: hidden;
    }

    .ring-container {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0 20px;
    }

    .progress-ring {
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }

    .ring-bg {
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 14;
    }

    .ring-progress {
      stroke: var(--primary);
      stroke-width: 14;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.6s ease;
      filter: drop-shadow(0 0 8px var(--primary-glow));
    }

    .ring-content {
      position: absolute;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .current-amount {
      font-size: 2.5rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -1px;
    }

    .unit {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .goal-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .percentage-tag {
      margin-top: 4px;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
    }

    /* Quick Add Buttons */
    .quick-add-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
    }

    .add-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text);
      border-radius: var(--radius-md);
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .add-btn:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-2px);
    }

    .add-btn:active {
      transform: translateY(0);
    }

    .add-btn .icon {
      font-size: 1.2rem;
    }

    .add-btn .label {
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* Custom Add Form */
    .custom-add-row {
      display: flex;
      gap: 8px;
      width: 100%;
      margin-top: 10px;
    }

    .custom-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    .custom-input:focus {
      border-color: var(--primary);
    }

    .btn-submit {
      background: var(--primary);
      color: #0f172a;
      border: none;
      border-radius: var(--radius-md);
      padding: 0 16px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      background: #7dd3fc;
    }

    /* Reminders Card */
    .reminder-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .reminder-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .reminder-text h4 {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .reminder-text p {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* Switch Toggle */
    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.1);
      transition: .3s;
      border-radius: 34px;
      border: 1px solid var(--card-border);
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--primary);
    }

    input:checked + .slider:before {
      transform: translateX(22px);
      background-color: #0f172a;
    }

    /* History Section */
    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .history-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: fadeIn 0.3s ease;
    }

    .history-details {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .history-amount {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .history-time {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .delete-item {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      transition: color 0.2s;
    }

    .delete-item:hover {
      color: var(--danger);
    }

    .empty-history {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 20px 0;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: #1e293b;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 20px 30px rgba(0,0,0,0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: var(--text);
      border-radius: var(--radius-md);
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-danger {
      background: var(--danger);
      border: none;
      color: white;
      border-radius: var(--radius-md);
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24">
          <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
        </svg>
        AquaFlow
      </div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <div class="streak-badge" id="streakBadge">
          🔥 <span id="streakCount">0</span> days
        </div>
        <button type="button" class="icon-btn" id="settingsBtn" aria-label="Settings">
          <svg viewBox="0 0 24 24">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Progress Card -->
    <main class="main-card">
      <div class="ring-container">
        <svg class="progress-ring" width="200" height="200">
          <circle class="ring-bg" cx="100" cy="100" r="82" fill="transparent"></circle>
          <circle class="ring-progress" id="progressRing" cx="100" cy="100" r="82" fill="transparent" stroke-dasharray="515.22" stroke-dashoffset="515.22"></circle>
        </svg>
        <div class="ring-content">
          <div class="current-amount" id="currentAmount">0</div>
          <div class="unit">ml</div>
          <div class="goal-text">Target: <span id="goalAmount">2000</span> ml</div>
          <div class="percentage-tag" id="percentageTag">0%</div>
        </div>
      </div>

      <!-- Quick Add Buttons -->
      <div class="quick-add-grid">
        <button type="button" class="add-btn" onclick="addWater(150)">
          <span class="icon">🥛</span>
          <span class="label">+150 ml</span>
        </button>
        <button type="button" class="add-btn" onclick="addWater(250)">
          <span class="icon">💧</span>
          <span class="label">+250 ml</span>
        </button>
        <button type="button" class="add-btn" onclick="addWater(500)">
          <span class="icon">🍾</span>
          <span class="label">+500 ml</span>
        </button>
      </div>

      <!-- Custom Amount Input -->
      <div class="custom-add-row">
        <input type="number" id="customInput" class="custom-input" placeholder="Custom amount (ml)" min="10" max="3000">
        <button type="button" class="btn-submit" onclick="addCustomWater()">Add</button>
      </div>
    </main>

    <!-- Reminder Card -->
    <div class="reminder-card">
      <div class="reminder-info">
        <svg style="width: 24px; height: 24px; fill: var(--primary);" viewBox="0 0 24 24">
          <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
        </svg>
        <div class="reminder-text">
          <h4>Hydration Reminders</h4>
          <p id="reminderStatusText">Disabled</p>
        </div>
      </div>
      <label class="switch">
        <input type="checkbox" id="reminderToggle" onchange="toggleReminders()">
        <span class="slider"></span>
      </label>
    </div>

    <!-- History Log -->
    <section>
      <div class="section-title">
        <span>Today's Log</span>
        <button type="button" style="background:none; border:none; color: var(--text-muted); font-size:0.8rem; cursor:pointer;" onclick="resetToday()">Reset Today</button>
      </div>
      <div class="history-list" id="historyList">
        <div class="empty-history">No water logged today yet.</div>
      </div>
    </section>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Preferences</h3>
        <button type="button" class="icon-btn" id="closeModalBtn" style="width:28px; height:28px;">&times;</button>
      </div>
      <div class="form-group">
        <label for="settingGoal">Daily Target (ml)</label>
        <input type="number" id="settingGoal" class="form-control" step="100" min="500" max="10000">
      </div>
      <div class="form-group">
        <label for="settingInterval">Reminder Interval</label>
        <select id="settingInterval" class="form-control">
          <option value="30">Every 30 minutes</option>
          <option value="45">Every 45 minutes</option>
          <option value="60" selected>Every 1 hour</option>
          <option value="120">Every 2 hours</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="button" class="btn-submit" onclick="saveSettings()">Save</button>
      </div>
    </div>
  </div>

  <script>
    const RADIUS = 82;
    const CIRCUMFERENCE = 2 * Math.PI * RADIUS;

    let state = {
      dailyGoal: 2000,
      currentIntake: 0,
      history: [],
      streak: 0,
      lastCompletedDate: null,
      remindersEnabled: false,
      reminderInterval: 60,
      lastDateStr: getTodayStr()
    };

    let reminderTimer = null;

    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function init() {
      loadState();
      checkNewDay();
      updateUI();
      setupEvents();
      if (state.remindersEnabled) {
        scheduleReminder();
      }
    }

    function loadState() {
      const saved = localStorage.getItem('aqua_flow_data');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          state = { ...state, ...parsed };
        } catch(e) {
          console.error("Failed to parse state", e);
        }
      }
    }

    function saveState() {
      localStorage.setItem('aqua_flow_data', JSON.stringify(state));
    }

    function checkNewDay() {
      const today = getTodayStr();
      if (state.lastDateStr !== today) {
        // Calculate if streak continues or resets
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        const yesterdayStr = `${yesterday.getFullYear()}-${String(yesterday.getMonth() + 1).padStart(2, '0')}-${String(yesterday.getDate()).padStart(2, '0')}`;

        if (state.lastCompletedDate !== yesterdayStr && state.lastCompletedDate !== today) {
          state.streak = 0; // Missed a day
        }

        state.currentIntake = 0;
        state.history = [];
        state.lastDateStr = today;
        saveState();
      }
    }

    function addWater(amount) {
      if (amount <= 0) return;
      
      const item = {
        id: Date.now(),
        amount: amount,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      state.currentIntake += amount;
      state.history.unshift(item);

      checkGoalMet();
      saveState();
      updateUI();
    }

    function addCustomWater() {
      const input = document.getElementById('customInput');
      const val = parseInt(input.value, 10);
      if (val && val > 0) {
        addWater(val);
        input.value = '';
      }
    }

    function deleteHistoryItem(id) {
      const index = state.history.findIndex(i => i.id === id);
      if (index !== -1) {
        state.currentIntake -= state.history[index].amount;
        if (state.currentIntake < 0) state.currentIntake = 0;
        state.history.splice(index, 1);
        saveState();
        updateUI();
      }
    }

    function resetToday() {
      if (confirm('Are you sure you want to reset today\'s water intake?')) {
        state.currentIntake = 0;
        state.history = [];
        saveState();
        updateUI();
      }
    }

    function checkGoalMet() {
      const today = getTodayStr();
      if (state.currentIntake >= state.dailyGoal && state.lastCompletedDate !== today) {
        state.lastCompletedDate = today;
        state.streak += 1;
        triggerCelebration();
      }
    }

    function triggerCelebration() {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('🎉 Goal Achieved!', {
          body: `Awesome! You reached your daily goal of ${state.dailyGoal} ml! Streak: ${state.streak} days!`,
          icon: 'https://cdn-icons-png.flaticon.com/512/3105/3105807.png'
        });
      } else {
        alert(`🎉 Goal Achieved! You reached your daily water target of ${state.dailyGoal} ml!`);
      }
    }

    function updateUI() {
      // Elements
      const currentEl = document.getElementById('currentAmount');
      const goalEl = document.getElementById('goalAmount');
      const percentEl = document.getElementById('percentageTag');
      const ring = document.getElementById('progressRing');
      const streakEl = document.getElementById('streakCount');
      const historyList = document.getElementById('historyList');
      const reminderToggle = document.getElementById('reminderToggle');
      const reminderStatus = document.getElementById('reminderStatusText');

      // Ring Calc
      const pct = Math.min(1, state.currentIntake / state.dailyGoal);
      const offset = CIRCUMFERENCE - (pct * CIRCUMFERENCE);
      ring.style.strokeDashoffset = offset;

      // Values
      currentEl.textContent = state.currentIntake.toLocaleString();
      goalEl.textContent = state.dailyGoal.toLocaleString();
      const pctInt = Math.round((state.currentIntake / state.dailyGoal) * 100);
      percentEl.textContent = `${pctInt}%`;
      streakEl.textContent = state.streak;

      // Reminder Switch
      reminderToggle.checked = state.remindersEnabled;
      reminderStatus.textContent = state.remindersEnabled 
        ? `Active (${state.reminderInterval}m intervals)` 
        : 'Disabled';

      // History Render
      if (state.history.length === 0) {
        historyList.innerHTML = '<div class="empty-history">No water logged today yet.</div>';
      } else {
        historyList.innerHTML = state.history.map(item => `
          <div class="history-item">
            <div class="history-details">
              <span style="font-size: 1.1rem;">💧</span>
              <div>
                <div class="history-amount">+${item.amount} ml</div>
                <div class="history-time">${item.time}</div>
              </div>
            </div>
            <button type="button" class="delete-item" onclick="deleteHistoryItem(${item.id})" title="Delete">
              <svg style="width:18px;height:18px;fill:currentColor" viewBox="0 0 24 24">
                <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
              </svg>
            </button>
          </div>
        `).join('');
      }
    }

    function toggleReminders() {
      const toggle = document.getElementById('reminderToggle');
      if (toggle.checked) {
        if ('Notification' in window) {
          Notification.requestPermission().then(permission => {
            if (permission === 'granted') {
              state.remindersEnabled = true;
              scheduleReminder();
            } else {
              alert('Notification permission is required to enable reminders.');
              toggle.checked = false;
              state.remindersEnabled = false;
            }
            saveState();
            updateUI();
          });
        } else {
          alert('Browser notifications are not supported in this browser.');
          toggle.checked = false;
          state.remindersEnabled = false;
          saveState();
          updateUI();
        }
      } else {
        state.remindersEnabled = false;
        if (reminderTimer) clearInterval(reminderTimer);
        saveState();
        updateUI();
      }
    }

    function scheduleReminder() {
      if (reminderTimer) clearInterval(reminderTimer);
      const ms = state.reminderInterval * 60 * 1000;
      reminderTimer = setInterval(() => {
        if (state.remindersEnabled && state.currentIntake < state.dailyGoal) {
          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification('💧 Time to Drink Water!', {
              body: 'Stay hydrated! Log a glass of water now.',
              icon: 'https://cdn-icons-png.flaticon.com/512/3105/3105807.png'
            });
          }
        }
      }, ms);
    }

    /* Modal Management */
    function openModal() {
      document.getElementById('settingGoal').value = state.dailyGoal;
      document.getElementById('settingInterval').value = state.reminderInterval;
      document.getElementById('settingsModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('settingsModal').classList.remove('active');
    }

    function saveSettings() {
      const newGoal = parseInt(document.getElementById('settingGoal').value, 10);
      const newInterval = parseInt(document.getElementById('settingInterval').value, 10);

      if (newGoal && newGoal > 0) {
        state.dailyGoal = newGoal;
      }
      if (newInterval && newInterval > 0) {
        state.reminderInterval = newInterval;
      }

      saveState();
      updateUI();
      closeModal();

      if (state.remindersEnabled) {
        scheduleReminder();
      }
    }

    function setupEvents() {
      document.getElementById('settingsBtn').addEventListener('click', openModal);
      document.getElementById('closeModalBtn').addEventListener('click', closeModal);
      document.getElementById('customInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addCustomWater();
      });
    }

    // Run on init
    init();
  </script>
</body>
</html>
